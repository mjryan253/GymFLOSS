# The browser-only demo build (VITE_DEMO=1): guest mode over a seeded example history, no
# backend. Exercise media comes from the jsDelivr mirror of the upstream dataset — it is
# © Gym visual and must never be committed or served from this repo. See NOTICE.md.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:demo
        working-directory: frontend
      - uses: actions/configure-pages@v6
        with:
          # Asks the API to turn Pages on. The default GITHUB_TOKEN is not always
          # permitted to do that on a user-owned repo, in which case this step fails
          # until Pages is enabled once by hand:
          #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
          # Everything before this step (npm ci, build:demo) is unaffected.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
