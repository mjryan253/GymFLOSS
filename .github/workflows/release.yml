# Builds the Android APK on a release tag and attaches it to the GitHub Release, so people can
# sideload a signed build (or track it with Obtainium) instead of setting up a toolchain. Mirrors
# build-apk.sh: same SDK packages, same align-then-sign steps, same signing key — the key lives
# in repo secrets, and it must stay the same one, or updates won't install over an existing app.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'      # the app targets Java 21; Gradle 8.11 tops out at 23
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Build the web bundle and sync the Android project
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile:android

      - name: Assemble the release APK
        working-directory: frontend/android
        run: ./gradlew --console=plain assembleRelease

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "ANDROID_KEYSTORE_B64 secret is not set"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK="GymFLOSS-${GITHUB_REF_NAME#v}.apk"
          "$BT/zipalign" -f -p 4 \
            frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias gymfloss \
            --ks-pass env:KS_PASS --out "$APK" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore" "$APK.idsig"
          "$BT/apksigner" verify --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          body: |
            Sideload the APK below, or track this repo in [Obtainium](https://github.com/ImranR98/Obtainium).
            Self-hosting instead? See [docs/SELF_HOSTING.md](docs/SELF_HOSTING.md).

            What changed: [CHANGELOG.md](CHANGELOG.md)
