# The training logic is pure functions with tests beside them, and every locale must carry an
# identical key set (a missing key falls back to English silently, mid-sentence). Both are
# checked here because neither fails loudly on its own. The api job boots the real server and
# asserts its HTTP contract, on the Node the Docker image runs (22) and the next target (24).
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:locales
      - run: npm run build

  api:
    name: api (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test
