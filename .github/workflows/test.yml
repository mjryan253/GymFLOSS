# The training logic is pure functions with tests beside them, and every locale must carry an
# identical key set (a missing key falls back to English silently, mid-sentence). Both are
# checked here because neither fails loudly on its own.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:locales
      - run: npm run build
